# HTTP-only edge config. This is the default, and it has two jobs:
#
#   1. it is what runs locally, where there are no certificates at all;
#   2. it is what serves the ACME challenge while certbot issues the FIRST
#      certificate -- nginx refuses to start if an `ssl_certificate` directive
#      points at a file that does not exist, so app-tls.conf cannot be the
#      config that is running when you request that certificate.
#
# Once certbot has written /etc/letsencrypt/live/<domain>/, set
# NGINX_CONF=app-tls.conf in .env and `docker compose up -d nginx`.

server {
    listen 80;
    server_name _;

    # Matched before anything else (^~), so it keeps working after TLS is on
    # and this block starts redirecting -- renewal needs it every 60 days.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/app-proxy.conf;
}
