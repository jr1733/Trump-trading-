# Shared routing, included by both app.conf (HTTP) and app-tls.conf (HTTPS) so
# the two can never drift apart.
#
# /api goes straight to the API container. Everything else goes to the `web`
# container, whose own nginx (frontend/nginx.conf) owns the static cache policy
# -- the service-worker no-store rule, the manifest content type, and the
# immutable rule for Vite's fingerprinted assets. Those headers are deliberately
# NOT duplicated here: two copies of a cache policy is how a stale service
# worker pins itself in place across a deploy and nobody can work out why.

client_max_body_size 4m;

# --- security headers -----------------------------------------------------
# The app is same-origin by construction: the bearer token lives in
# localStorage and travels in an Authorization header, so there is no cookie
# to protect and no cross-site form post to defend against.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The API is behind TLS termination, so without this it would believe every
    # request arrived over plain HTTP.
    proxy_set_header X-Forwarded-Proto $scheme;
    # A backtest recomputes every signal point-in-time and can legitimately run
    # for a couple of minutes. The default 60s would cut it off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / {
    proxy_pass http://web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
