# Production edge config: HTTP redirects to HTTPS, HTTPS serves the app.
#
# Switch to this ONLY after certbot has issued a certificate -- nginx will not
# start if /etc/letsencrypt/live/${DOMAIN}/fullchain.pem is missing. See
# app.conf for the bootstrap order.
#
# ${DOMAIN} is substituted by the nginx image's envsubst at container start
# (this file is mounted into /etc/nginx/templates/ as a .template), so the
# domain lives in .env and not in the repository.

server {
    listen 80;
    server_name ${DOMAIN};

    # The challenge location must come BEFORE the redirect and must be matched
    # with ^~, or renewal requests get 301'd to HTTPS and certbot fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # `http2 on;` is the nginx >= 1.25 form; compose pins nginx:1.27-alpine.
    # On 1.24 or older this is an "unknown directive" error -- use the
    # deprecated `listen 443 ssl http2;` there instead.
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. Note the consequence before enabling: browsers will refuse plain
    # HTTP to this domain for a year, so if TLS breaks the site is unreachable
    # rather than merely insecure. Start with a short max-age if that worries
    # you, and do not add `preload` unless you are certain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # iOS will only deliver Web Push to a Home-Screen-installed PWA, and it
    # will only install one over a valid certificate. That is the whole reason
    # this file exists rather than running the app on plain HTTP.
    include /etc/nginx/snippets/app-proxy.conf;
}
